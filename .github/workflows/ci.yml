name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: psychosis-guard check-config
      - run: psychosis-guard demo --turns 6

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t psychosis-guard:ci .
      - name: smoke test container
        run: |
          docker run -d --rm --name pg -p 8080:8080 -e PG_CHAT_PROVIDER=mock psychosis-guard:ci
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:8080/v1/guard/turn \
            -H 'content-type: application/json' -d '{"message":"hello"}' | grep -q '"reply"'
          docker stop pg
